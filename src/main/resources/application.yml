spring:
  application:
    name: dublin-bikes-spring
  config:
    # Read secrets from .env in the repository root (e.g. JCDECAUX_API_KEY=...); .env is never committed, and a missing file is not an error
    import: optional:file:.env[.properties]
  http:
    clients:
      # Timeouts shared by every RestClient: give up connecting after 2 seconds, wait at most 10 seconds for a response
      connect-timeout: 2s
      read-timeout: 10s
  cache:
    cache-names: currentWeather,weatherForecast
    caffeine:
      # Cached entries expire after 5 minutes; repeated requests within 5 minutes do not call OpenWeather again
      spec: expireAfterWrite=5m,maximumSize=100
  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema; Hibernate only checks that entities match the tables and fails startup if they do not
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

app:
  jcdecaux:
    api-key: ${JCDECAUX_API_KEY:}
  scraper:
    enabled: ${SCRAPER_ENABLED:false}
    interval: 5m
  forecast:
    # URL of the Python inference service (ml-service/, runs on port 8001 by default)
    base-url: ${FORECAST_BASE_URL:http://localhost:8001}
  openweather:
    api-key: ${OPENWEATHER_API_KEY:}
  weather:
    interval: 10m
  google:
    # Key for server-side Geocoding / Directions calls; falls back to the browser key if there is no separate server key
    server-key: ${GOOGLE_MAPS_SERVER_KEY:${GOOGLE_MAPS_API_KEY:}}
    # Key the frontend uses to load the map (sent to the browser)
    browser-key: ${GOOGLE_MAPS_API_KEY:}
  groq:
    api-key: ${GROQ_API_KEY:}
    model: ${GROQ_MODEL:openai/gpt-oss-120b}


management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: always
